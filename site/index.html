/* Refined professional visual rhythm: no external font or network dependency. */
:root{--bg:#f4f7f8;--panel:#fff;--line:#dce5e8;--soft:#eef3f4;--text:#15292e;--muted:#60727b;--accent-base:#086e76}
.top{box-shadow:0 2px 14px rgba(4,38,45,.035)}
.card{box-shadow:0 3px 16px rgba(9,48,58,.035)}
.logo{border-radius:12px;box-shadow:0 4px 12px rgba(0,75,83,.14)}
.btn{transition:background .16s ease,transform .16s ease,box-shadow .16s ease}
.btn.primary{box-shadow:0 2px 8px rgba(0,74,80,.13)}
.btn:active{transform:translateY(1px)}
.tabs a:hover{color:var(--accent);background:var(--soft)}
.tk:hover{border-color:var(--accent);box-shadow:0 5px 18px rgba(7,65,72,.075)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10191c;--panel:#172327;--soft:#223135;--line:#34484c;--text:#eaf4f5;--muted:#a3b9bd}}

/* ---- RIFD 2026 professional interface, desktop-first with mobile-first behavior ---- */
:root {
 --accent-base:#067a82; --accent:var(--accent-base); --on-accent:#fff;
 --bg:#f3f6fa; --panel:#fff; --soft:#eff4f7; --line:#e2e9ef;
 --text:#15283b; --muted:#68798b; --ok:#128453; --warn:#a36a1a; --bad:#d3444b;
 --font: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);font-size:14px;line-height:1.65;letter-spacing:0}
button,input,select,textarea{font-family:inherit}
h1{font-size:clamp(24px,2vw,32px);font-weight:800;letter-spacing:-.65px;margin-bottom:5px}
.lead{font-size:14px;line-height:1.8;color:var(--muted);margin-bottom:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 28px rgba(16,45,70,.035)}
.pad{padding:23px}
.card h2{font-weight:750;font-size:15px;padding:16px 20px}
.btn{border-radius:11px;font-weight:650;padding:9px 16px;border-color:var(--line);transition:.17s ease;box-shadow:none}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 15px rgba(16,45,70,.07)}
.btn.primary{background:var(--accent);border-color:var(--accent);box-shadow:0 5px 14px rgba(3,109,119,.12)}
.btn.big{padding:12px 20px;border-radius:12px}
input[type=text],input[type=search],input[type=number],input[type=password],select,textarea{border-radius:10px;border:1px solid #dbe4eb;background:var(--panel);min-height:43px;padding:10px 12px;box-shadow:0 1px 0 rgba(0,0,0,.005)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(4,125,135,.16);border-color:var(--accent)}
.chip{padding:3px 9px;font-weight:700}
.kpis{grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:15px;margin-bottom:20px}
.kpi{padding:22px}
.kpi b{font-size:34px;font-weight:800;letter-spacing:-1px}
.kpi span{font-size:13px}
.ops-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}
.ops-tile{padding:22px;border-radius:18px;overflow:hidden;position:relative;min-height:144px}
.ops-tile::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--accent);opacity:.8}
.ops-tile b{font-size:36px;letter-spacing:-1px}
.ops-tile span{font-weight:750;color:var(--text)}
.ops-tile small{font-size:12px}
.tw table{min-width:650px}
thead{background:#f7f9fb}
th,td{padding:12px 15px}
th{font-size:12px;font-weight:750}
.pills button{border-radius:9px;font-weight:650}
.tk{border-radius:13px;border:1px solid var(--line);border-inline-start-width:4px;padding:19px}
.tk h3{font-size:15px;font-weight:750}
.asset-list{gap:14px}
.asset-item{padding:20px;border-radius:16px}
.asset-item h3{font-weight:750}
.dh{padding:20px}
.drawer{box-shadow:-10px 0 50px rgba(7,30,45,.16)}
/* Main application: permanent compact operations rail on larger displays. */
@media(min-width:1050px){
  .top{position:fixed;z-index:30;inset-inline-start:0;top:0;bottom:0;width:255px;border:0;border-inline-end:1px solid #183b52;background:#0d2638;color:#e9f6fa;box-shadow:4px 0 30px rgba(8,37,54,.09)}
  .top .wrap{height:100%;max-width:none;padding:24px 14px;display:flex;flex-direction:column;overflow-y:auto}
  .top .in{display:flex;flex-direction:column;align-items:stretch;padding:0 8px 22px;border-bottom:1px solid rgba(240,250,255,.13);gap:13px}
  .top .brand{gap:11px;margin-bottom:8px;align-items:center}
  .top .brand b{font-size:22px;color:#fff;letter-spacing:-.5px}
  .top .brand small{display:block;color:#91afbf;font-size:10.5px;line-height:1.3}
  .top .logo{width:48px;height:48px;padding:5px;flex:none;box-shadow:none;background:linear-gradient(145deg,#184b5d,#0d364c);border:1px solid rgba(255,255,255,.09);border-radius:15px}
  .top .logo img{width:100%;height:100%;object-fit:contain}
  .top .spacer{display:none}
  .top .role{flex-direction:column;align-items:flex-start;gap:4px;padding:13px;background:rgba(255,255,255,.055);border-radius:12px;color:#b7cbd6;font-size:12px}
  .top .role .me{color:#fff;font-weight:750;font-size:13px}
  .top .role .chip{background:rgba(14,194,190,.14);color:#72e2dd}
  .top .bell{position:absolute;bottom:76px;right:22px;background:rgba(255,255,255,.08);color:#fff}
  .top #b-out{position:absolute;bottom:22px;right:72px;left:20px;color:#eaf7fb;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055)}
  .top .tabs{display:flex;flex-direction:column;border:0;gap:6px;overflow:visible;padding-top:21px;padding-bottom:92px}
  .top .tabs a{width:100%;display:flex;align-items:center;gap:14px;color:#a6bdcb;min-height:47px;padding:11px 14px;border:0;border-radius:11px;font-weight:650;letter-spacing:0;text-decoration:none}
  .top .tabs a:hover{background:rgba(255,255,255,.075);color:#fff}
  .top .tabs a[aria-current=page]{color:#fff;background:linear-gradient(105deg,rgba(1,151,160,.3),rgba(1,151,160,.12));box-shadow:inset 3px 0 0 #36d6c7}
  .top .tabs a .n{margin-inline-start:auto;background:#e65263}
  .nav-symbol{width:24px;display:inline-flex;justify-content:center;font-size:20px;font-family:"Segoe UI Symbol",sans-serif;line-height:1;color:inherit;opacity:.94}
  main.wrap{margin-inline-start:255px;max-width:none;padding:37px clamp(24px,3vw,56px) 85px;min-height:100vh}
  .demobar,.offline{margin-inline-start:255px;justify-content:center}
  .demobar{font-size:12px;min-height:45px}
}
/* Login: clear visual hierarchy and high-trust identity */
.rifd-auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(440px,.9fr);padding:0;min-height:100vh;background:#f3f7f9;max-width:none;gap:0;align-items:stretch}
.auth-hero{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:#0d2638;color:white;padding:clamp(28px,5vw,72px)}
.auth-hero:before{content:"";position:absolute;width:520px;height:520px;right:-200px;bottom:-230px;border-radius:50%;border:85px solid rgba(24,203,195,.075);pointer-events:none}
.auth-hero:after{content:"";position:absolute;width:480px;height:480px;right:45%;top:-280px;border-radius:50%;background:radial-gradient(circle,rgba(9,186,175,.16),transparent 66%);pointer-events:none}
.auth-hero-top img{max-width:285px;width:58%;object-fit:contain;filter:none}
.auth-kicker{display:inline-block;direction:ltr;letter-spacing:2.5px;font-size:11px;color:#52dad2;font-weight:800;margin-bottom:18px}
.auth-hero-copy{position:relative;z-index:1}
.auth-hero-copy h2{font-size:clamp(38px,4.5vw,68px);line-height:1.3;letter-spacing:-2px;font-weight:850;margin:0 0 22px}
.auth-hero-copy p{font-size:17px;line-height:2;max-width:400px;color:#bed1dc}
.auth-highlights{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}
.auth-highlights span{border:1px solid rgba(115,221,215,.22);border-radius:999px;background:rgba(27,140,146,.12);color:#dafaf6;padding:7px 14px;font-size:12px;font-weight:700}
.auth-hero-foot{position:relative;z-index:1;color:#8caabc;font-size:12px}
.auth-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px}
.auth-card.card{width:min(450px,100%);max-width:none;box-shadow:0 18px 55px rgba(17,47,67,.065);padding:36px;background:#fff;border:1px solid #e8eef2;border-radius:23px}
.auth-intro{display:flex;gap:14px;align-items:center;margin-bottom:28px;text-align:start}
.auth-compact-logo{width:63px;height:63px;background:#eaf8f7;border-radius:18px;padding:8px;flex:none;display:grid;place-items:center}
.auth-compact-logo img{max-width:100%;max-height:100%;object-fit:contain}
.auth-mini{font-size:12px;font-weight:750;color:#047c82}
.auth-intro h1{font-size:30px;margin:0;color:#0e2538}
.auth-intro .lead{margin:0;font-size:12px;line-height:1.5}
.auth-card .l{font-size:13px}
.auth-card .btn.big.wide{min-height:48px;font-size:15px}
.auth-legal{font-size:12px;color:#7d8e9a;text-align:center;max-width:380px;margin-top:16px}
.auth-card .demoacc{background:#f5fafb;border-color:#d9e9ea}
.logo img.rifd-brand-mark{object-fit:contain;padding:4px}

}

 .ops-tile{padding:16px;min-height:122px}

const MAXPX = 1280;
function downscale(file) {
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) return reject(new Error('الملف ليس صورة.'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let { width: w, height: hh } = img; const k = Math.min(1, MAXPX / Math.max(w, hh)); w = Math.round(w * k); hh = Math.round(hh * k);
      const c = document.createElement('canvas'); c.width = w; c.height = hh; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, hh); x.drawImage(img, 0, 0, w, hh);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذّر قراءة الصورة.')); };
    img.src = url;
  });
}

FZ.photoPicker = (id, max = 5) => {
  const st = { imgs: [] };

    $('#' + id + '-th').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { st.imgs.splice(+b.dataset.rm, 1); draw(); });
    $('#' + id + '-th').querySelectorAll('[data-lb]').forEach(i => i.onclick = () => FZ.lightbox(i.src));
    const full = st.imgs.length >= max; $('#' + id + '-add').disabled = full; $('#' + id + '-cam').disabled = full;
  };
  const html = `<div class="drop"><div><label class="btn sm" for="${id}-cam" id="${id}-camL" style="cursor:pointer">📷 تصوير</label><input type="file" id="${id}-cam" accept="image/*" capture="environment" class="sr"><label class="btn sm" for="${id}-add" style="cursor:pointer">🖼️ اختيار من الجهاز</label><input type="file" id="${id}-add" accept="image/*" multiple class="sr"></div><div class="hint">حتى ${max} صور. تُصغَّر تلقائيًا قبل الرفع.</div><div class="thumbs" id="${id}-th"></div></div>`;

async function doAct(action, body) {

  d.querySelectorAll('[data-do]').forEach(b => b.onclick = async () => { try { await doAct(b.dataset.do, {}); FZ.toast('شكرًا، أُغلق البلاغ'); } catch (x) { FZ.toast(x.message, true); } });

/* ---------- البث اللحظي ---------- */
let es = null, rt;
function startStream() {
  stopStream(); es = new EventSource('/api/stream');
  es.addEventListener('note', e => {
    const n = JSON.parse(e.data); S.notes.unshift(n); S.unread++; renderTabs();
    FZ.toast('🔔 ' + n.text);
    if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && document.hidden) {
      try { const x = new Notification(S.org.name, { body: n.text, tag: 'fz-' + n.id, data: { url: '/#/t/' + n.ticket_id } }); x.onclick = () => { window.focus(); location.hash = '#/t/' + n.ticket_id; x.close(); }; } catch (_) {}
    }
    if (S.view === 'notifs') viewNotifs($('#view'));
  });
  es.addEventListener('refresh', e => {
    const { ticketId } = JSON.parse(e.data); clearTimeout(rt);
    rt = setTimeout(async () => {
      if (!S.me) return;
      if (S.openId === ticketId && !S.panel) { try { S.detail = await api('GET', '/api/tickets/' + ticketId); drawTicket(); } catch (_) {} }
      if (S.view === 'tickets' && $('#tl')) { await loadTickets(); drawTickets(); } else { try { const c = await api('GET', '/api/tickets?status=open'); S.counts = c.counts; renderTabs(); } catch (_) {} }
    }, 350);
  });
}
function stopStream() { if (es) { es.close(); es = null; } }

    <div class="card" style="margin-bottom:14px"><h2>آخر 14 يومًا</h2><div class="pad"><div class="days" style="grid-template-columns:repeat(14,1fr)">${R.series.map(x => `<div class="dcol"><div class="dbars"><i class="c" style="height:${Math.round(x.created / mx * 100)}%" title="وردت ${x.created}"></i><i class="d" style="height:${Math.round(x.solved / mx * 100)}%" title="حُلّت ${x.solved}"></i></div><small>${dn[new Date(x.d).getDay()]}</small></div>`).join('')}</div><div class="leg"><span><i style="background:var(--accent)"></i>وردت</span><span><i style="background:var(--ok)"></i>حُلّت</span></div></div></div>`;
    $('#r-per').onchange = e => { rdays = +e.target.value; FZ.viewReports(v); };
    $('#r-tech').onchange = e => { rtech = e.target.value; FZ.viewReports(v); };
  };

  /* ---------- المستخدمون ---------- */
  let newAcc = null;
  window.addEventListener('hashchange', () => { newAcc = null; });
  FZ.viewUsers = async v => {
    const [U, A] = await Promise.all([api('GET', '/api/users'), api('GET', '/api/audit')]);
    const L = S.lists, EVN = { login: 'دخول', logout: 'خروج', login_fail: 'محاولة دخول فاشلة', login_blocked: 'دخول مرفوض (حساب موقوف)', setup: 'الإعداد الأول', password_change: 'تغيير كلمة المرور', user_create: 'إنشاء حساب', user_reset: 'إعادة تعيين كلمة المرور', user_disable: 'إيقاف حساب', user_enable: 'إعادة تفعيل حساب', user_edit: 'تعديل حساب', settings: 'تعديل الإعدادات', list_add: 'إضافة إلى قائمة', list_toggle: 'تعديل قائمة', export_csv: 'تصدير البلاغات', backup: 'تنزيل نسخة احتياطية', logo_set: 'تغيير الشعار', logo_remove: 'إزالة الشعار' };
    const stat = u => u.disabled ? '<span class="chip late">موقوف</span>' : u.must_change ? '<span class="chip wait">بانتظار التفعيل</span>' : '<span class="chip okk">مفعّل</span>';
    const card = newAcc ? `<div class="card pad acc-new" style="border-color:var(--accent);margin-bottom:14px"><b>${newAcc.reset ? 'كلمة مرور مؤقتة جديدة' : 'تم إنشاء الحساب'} لـ ${h(newAcc.name)}</b><p class="hint">تظهر هذه البيانات الآن فقط. سلّمها للمستخدم، وسيُطلب منه اختيار كلمة مرور خاصة عند أول دخول.</p><textarea id="acc-msg" rows="5" readonly>${h(`${S.org.name}\nالرابط: ${location.origin}\nاسم المستخدم: ${newAcc.username}\nكلمة المرور المؤقتة: ${newAcc.password}`)}</textarea><div class="fieldrow" style="margin-top:8px"><button class="btn primary" id="acc-copy">نسخ البيانات</button><button class="btn" id="acc-done">تم التسليم</button><span class="hint" id="acc-m" aria-live="polite"></span></div></div>` : '';
    v.innerHTML = `<h1>المستخدمون</h1><p class="lead">أنت من ينشئ الحسابات. كل موظف يدخل باسمه وكلمة مروره، ولا أحد يرى إلا ما يخصه.</p>${card}
    <div class="card" style="margin-bottom:14px"><h2>الحسابات (${U.users.length})</h2><div class="tw"><table><thead><tr><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>الإدارة</th><th>الحالة</th><th>آخر دخول</th><th></th></tr></thead><tbody>
    ${U.users.map(u => `<tr><td><b>${h(u.name)}</b>${u.phone ? `<div class="hint mono">${h(u.phone)}</div>` : ''}</td><td class="mono">${h(u.username)}</td><td>${ROLEN[u.role]}</td><td>${h(u.dept)}</td><td>${stat(u)}</td><td>${u.last_login ? FZ.ago(u.last_login) : 'لم يدخل'}</td>
    <td><div class="tbl-act"><button class="btn sm" data-edit="${u.id}">تعديل</button>${u.id === S.me.id ? '<span class="hint">حسابك</span>' : `<button class="btn sm" data-rst="${u.id}">كلمة مرور جديدة</button><button class="btn sm ${u.disabled ? '' : 'danger'}" data-tg="${u.id}">${u.disabled ? 'إعادة تفعيل' : 'إيقاف'}</button>`}</div></td></tr>`).join('')}</tbody></table></div></div>
    <div class="card pad" style="margin-bottom:14px"><b>إنشاء حساب جديد</b><form id="uf" novalidate><div class="grid2" style="margin-top:10px">
      <div class="fld"><label class="l" for="u-n">الاسم الكامل</label><input type="text" id="u-n" maxlength="40"></div>
      <div class="fld"><label class="l" for="u-un">اسم المستخدم</label><input type="text" id="u-un" maxlength="20" dir="ltr" autocapitalize="none" placeholder="sara.a"><div class="hint">حروف إنجليزية صغيرة وأرقام ونقطة.</div></div>
      <div class="fld"><label class="l" for="u-r">الدور</label><select id="u-r">${Object.keys(ROLEN).map(r => `<option value="${r}">${ROLEN[r]}</option>`).join('')}</select></div>
      <div class="fld" id="u-dw"><label class="l" for="u-d">الإدارة</label><select id="u-d">${L.dept.filter(d => d.active).map(d => `<option value="${d.id}">${h(d.name)}</option>`).join('')}</select></div>
      <div class="fld"><label class="l" for="u-ph">الجوال <span class="subtle">— اختياري</span></label><input type="text" id="u-ph" dir="ltr" inputmode="tel" maxlength="16" placeholder="05xxxxxxxx"></div></div>
      <div class="err" id="u-err" role="alert"></div><button class="btn primary" type="submit">إنشاء الحساب وكلمة مرور مؤقتة</button></form></div>
    <div class="card"><h2>سجل الدخول والإدارة (آخر 200 حدث)</h2><div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr><th>الوقت</th><th>المستخدم</th><th>الحدث</th><th>التفاصيل</th><th>العنوان</th></tr></thead><tbody>${A.audit.map(a => `<tr><td>${FZ.fdate(a.at)}</td><td class="mono">${h(a.actor || '—')}</td><td>${h(EVN[a.action] || a.action)}</td><td>${h(a.target)} ${h(a.detail)}</td><td class="mono">${h(a.ip)}</td></tr>`).join('')}</tbody></table></div></div>`;
    const roleChange = () => { $('#u-dw').hidden = ['itm', 'tech'].includes($('#u-r').value); };
    $('#u-r').onchange = roleChange; roleChange();
    $('#uf').onsubmit = async e => {
      e.preventDefault(); const er = $('#u-err'); er.textContent = '';
      try { newAcc = await api('POST', '/api/users', { name: $('#u-n').value, username: $('#u-un').value, role: $('#u-r').value, dept_id: +$('#u-d').value, phone: $('#u-ph').value }); FZ.viewUsers(v); window.scrollTo(0, 0); }
      catch (x) { er.textContent = x.message; }
    };
    const cp = $('#acc-copy'); if (cp) { cp.onclick = async () => { const t = $('#acc-msg'); try { await navigator.clipboard.writeText(t.value); $('#acc-m').textContent = 'نُسخت.'; } catch (_) { t.select(); document.execCommand('copy'); $('#acc-m').textContent = 'نُسخت.'; } }; $('#acc-done').onclick = () => { newAcc = null; FZ.viewUsers(v); }; }
    v.querySelectorAll('[data-rst]').forEach(b => b.onclick = async () => {
      const u = U.users.find(x => x.id === +b.dataset.rst);
      if (!(await FZ.confirmDlg('كلمة مرور جديدة', `سيُلغى دخول ${u.name} الحالي ويُطلب منه اختيار كلمة مرور جديدة. متابعة؟`, 'متابعة'))) return;
      try { newAcc = { ...(await api('POST', `/api/users/${u.id}/reset`, {})), reset: true }; FZ.viewUsers(v); window.scrollTo(0, 0); } catch (x) { FZ.toast(x.message, true); }
    });
    v.querySelectorAll('[data-tg]').forEach(b => b.onclick = async () => {
      const u = U.users.find(x => x.id === +b.dataset.tg);
      if (!u.disabled && !(await FZ.confirmDlg('إيقاف الحساب', `سيُخرَج ${u.name} فورًا ولن يستطيع الدخول.${u.open ? ` لديه ${u.open} بلاغ مفتوح، أعد إسنادها.` : ''}`, 'إيقاف', true))) return;
      try { const r = await api('POST', `/api/users/${u.id}/toggle`, {}); FZ.toast(r.disabled ? 'أُوقف الحساب' : 'أُعيد تفعيل الحساب'); FZ.viewUsers(v); } catch (x) { FZ.toast(x.message, true); }
    });
    v.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
      const u = U.users.find(x => x.id === +b.dataset.edit), d = $('#dlg');
      d.innerHTML = `<div class="dh2">تعديل ${h(u.name)}</div><div class="db"><div class="fld"><label class="l" for="e-n">الاسم</label><input type="text" id="e-n" value="${h(u.name)}"></div><div class="fld"><label class="l" for="e-r">الدور</label><select id="e-r" ${u.id === S.me.id ? 'disabled' : ''}>${Object.keys(ROLEN).map(r => `<option value="${r}" ${r === u.role ? 'selected' : ''}>${ROLEN[r]}</option>`).join('')}</select></div><div class="fld" id="e-dw"><label class="l" for="e-d">الإدارة</label><select id="e-d">${L.dept.filter(x => x.active || x.id === u.dept_id).map(x => `<option value="${x.id}" ${x.id === u.dept_id ? 'selected' : ''}>${h(x.name)}</option>`).join('')}</select></div><div class="fld"><label class="l" for="e-p">الجوال</label><input type="text" id="e-p" dir="ltr" value="${h(u.phone)}"></div><div class="err" id="e-err"></div></div><div class="da"><button class="btn primary" id="e-ok">حفظ</button><button class="btn" id="e-no">إلغاء</button></div>`;
      const rc = () => { $('#e-dw').hidden = ['itm', 'tech'].includes($('#e-r').value); }; $('#e-r').onchange = rc; rc();
      $('#e-no').onclick = () => d.close();
      $('#e-ok').onclick = async () => { try { await api('POST', `/api/users/${u.id}/edit`, { name: $('#e-n').value, role: $('#e-r').value, dept_id: +$('#e-d').value, phone: $('#e-p').value }); d.close(); FZ.toast('تم الحفظ'); FZ.viewUsers(v); } catch (x) { $('#e-err').textContent = x.message; } };
      d.onclose = null; d.showModal();
    });
  };

  /* ---------- الإعدادات ---------- */
  const EMO = ['◈', '🚀', '🛟', '⚡', '🛡️', '🔧', '🚨', '🧰', '🛠️', '💡', '🧭', '🔔'];
  const COL = ['#0b6b6f', '#2b4fa8', '#6b3fa0', '#b02f4a', '#c2570a', '#1b7a3a', '#37474f'];
  FZ.viewSettings = async v => {
    const o = S.org, L = S.lists;
    const chips = (arr, kind) => arr.map(x => `<span class="chip" style="${x.active ? '' : 'opacity:.5;text-decoration:line-through'}">${h(x.name)}<button type="button" data-lt="${x.id}" aria-label="${x.active ? 'إيقاف' : 'تفعيل'} ${h(x.name)}">${x.active ? '✕' : '↺'}</button></span>`).join('');
    v.innerHTML = `<h1>الإعدادات</h1><p class="lead">هوية المنظومة والإدارات والقوائم. تُحفظ التغييرات في هذا المتصفح ويمكن عرضها في تبويباته. المزامنة بين الأجهزة تحتاج خادمًا.</p>
    <div class="two"><div class="card pad"><b>هوية المنظومة</b>
      <div class="fld" style="margin-top:10px"><label class="l" for="s-name">الاسم</label><input type="text" id="s-name" maxlength="30" value="${h(o.name)}"></div>
      <div class="fld"><label class="l" for="s-tag">الشعار اللفظي</label><input type="text" id="s-tag" maxlength="60" value="${h(o.tagline)}"></div>
      <div class="fld"><span class="l" style="display:block;font-weight:600;margin-bottom:5px">الرمز</span><div class="emopick" id="emo">${EMO.map(e => `<button type="button" data-e="${e}" aria-pressed="${e === o.emoji}">${e}</button>`).join('')}</div><div class="hint">أو اكتب رمزك الخاص: <input type="text" id="s-emo" value="${h(o.emoji)}" maxlength="4" style="width:70px;display:inline-block;text-align:center"></div></div>
      <div class="fld"><span class="l" style="display:block;font-weight:600;margin-bottom:5px">لون الواجهة</span><div class="colors" id="cols">${COL.map(c => `<button type="button" class="swatch" data-c="${c}" style="background:${c}" aria-label="${c}" aria-pressed="${c.toLowerCase() === o.color.toLowerCase()}"></button>`).join('')}<input type="color" id="s-col" value="${h(o.color)}" aria-label="لون مخصص" style="width:38px;height:38px;padding:0;border:1px solid var(--line);border-radius:50%"></div></div>
      <div class="fld"><span class="l" style="display:block;font-weight:600;margin-bottom:5px">شعار المؤسسة (اختياري)</span><div class="fieldrow"><label class="btn sm" for="s-logo" style="cursor:pointer">رفع شعار</label><input type="file" id="s-logo" accept="image/png,image/jpeg,image/webp" class="sr">${o.has_logo ? '<button class="btn sm" id="s-rmlogo">إزالة الشعار</button>' : '<span class="hint">بدونه يظهر الرمز.</span>'}</div></div>
      <div class="grid2"><div class="fld"><label class="l" for="s-tg">المدة المستهدفة الأساسية (ساعات)</label><input type="number" id="s-tg" min="1" max="720" value="${o.target_hours}"></div><div class="fld"><label class="l" for="s-ac">إغلاق تلقائي بعد (أيام)</label><input type="number" id="s-ac" min="0" max="60" value="${o.autoclose_days}"><div class="hint">للبلاغ المحلول دون رد المبلّغ. 0 = معطّل. الأولويات العالية والحرجة تستخدم نصف وربع المدة الأساسية.</div></div></div>
      <div class="err" id="s-err" role="alert"></div><button class="btn primary" id="s-save">حفظ</button></div>
    <div class="card pad"><div class="fld"><b>الإدارات</b><div class="cfgrow" style="margin-top:8px">${chips(L.dept)}</div><div class="fieldrow" style="margin-top:8px"><input type="text" id="l-dept" placeholder="إدارة جديدة" class="grow"><button class="btn sm" data-add="dept">إضافة</button></div></div>
      <div class="fld"><b>أنواع المشاكل</b><div class="cfgrow" style="margin-top:8px">${chips(L.cat)}</div><div class="fieldrow" style="margin-top:8px"><input type="text" id="l-cat" placeholder="نوع جديد" class="grow"><button class="btn sm" data-add="cat">إضافة</button></div></div>
      <div class="fld"><b>الأماكن</b><div class="cfgrow" style="margin-top:8px">${chips(L.loc)}</div><div class="fieldrow" style="margin-top:8px"><input type="text" id="l-loc" placeholder="مكان جديد" class="grow"><button class="btn sm" data-add="loc">إضافة</button></div></div>
      <div class="hint">✕ تُوقف العنصر عن الظهور في النماذج دون حذف البلاغات القديمة، و↺ تعيده.</div></div></div>
    <div class="card pad"><b>النسخ الاحتياطي والتسليم</b><p class="hint">في نسخة العرض هذه تُحفظ البيانات داخل متصفحك. النشر متعدد المستخدمين يحتاج خادمًا موثوقًا وقاعدة بيانات وتسجيل دخول آمنًا؛ هذا الملف ليس نظام إنتاج. النسخ الاحتياطية تحتوي بيانات حساسة، بما فيها تجزئات كلمات المرور؛ احفظها في مكان آمن. لا تستخدم بيانات عمل حقيقية في هذا العرض.</p><div class="cfgrow"><a class="btn" href="/api/backup">تنزيل نسخة احتياطية JSON</a><label class="btn" for="rifd-restore" style="cursor:pointer">استعادة نسخة احتياطية</label><input type="file" id="rifd-restore" accept="application/json,.json" class="sr"><a class="btn" href="/api/export/tickets.csv">تصدير البلاغات CSV</a></div></div>`;
    let emo = o.emoji, col = o.color;
    v.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { emo = b.dataset.e; $('#s-emo').value = emo; v.querySelectorAll('[data-e]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    v.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { col = b.dataset.c; $('#s-col').value = col; v.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    $('#s-col').oninput = e => { col = e.target.value; v.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', 'false')); };
    $('#s-emo').oninput = e => { emo = e.target.value; };
    const apply = org => { S.org = { ...S.org, ...org, logo_v: Date.now() }; document.querySelector('.brand .logo').innerHTML = FZ.logoHtml(); document.querySelector('.brand b').textContent = S.org.name; document.querySelector('.brand small').textContent = S.org.tagline; document.documentElement.style.setProperty('--accent-base', S.org.color); document.title = S.org.name; };
    $('#s-save').onclick = async () => {
      const er = $('#s-err'); er.textContent = '';
      try { const r = await api('POST', '/api/settings', { name: $('#s-name').value, tagline: $('#s-tag').value, emoji: emo, color: col, target_hours: +$('#s-tg').value, autoclose_days: +$('#s-ac').value }); apply(r.org); FZ.toast('تم الحفظ'); FZ.viewSettings(v); } catch (x) { er.textContent = x.message; }
    };
    $('#s-logo').onchange = e => {
      const f = e.target.files[0]; if (!f) return; if (f.size > 450 * 1024) return FZ.toast('الشعار أكبر من 450 كيلوبايت.', true);
      const rd = new FileReader(); rd.onload = async () => { try { const r = await api('POST', '/api/logo', { data: rd.result }); apply(r.org); FZ.viewSettings(v); } catch (x) { FZ.toast(x.message, true); } }; rd.readAsDataURL(f);
    };
    const rm = $('#s-rmlogo'); if (rm) rm.onclick = async () => { const r = await api('POST', '/api/logo', {}); apply(r.org); FZ.viewSettings(v); };
    v.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => { const k = b.dataset.add, i = $('#l-' + k); try { const r = await api('POST', '/api/lists', { kind: k, name: i.value }); S.lists = r.lists; FZ.viewSettings(v); } catch (x) { FZ.toast(x.message, true); } });
    v.querySelectorAll('[data-lt]').forEach(b => b.onclick = async () => { try { const r = await api('POST', `/api/lists/${b.dataset.lt}/toggle`, {}); S.lists = r.lists; FZ.viewSettings(v); } catch (x) { FZ.toast(x.message, true); } });
  };
})();
</script></body></html>
